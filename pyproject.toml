[project]
name = "baybe-mcp"
version = "0.3.0"
description = "MCP server exposing BayBE's Bayesian optimization as tools for AI agents"
requires-python = ">=3.10"
dependencies = [
    "baybe[chem,insights]>=0.15",
    "mcp[cli]",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
